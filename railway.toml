[build]
builder = "NIXPACKS"
buildCommand = "npm install"

[deploy]
startCommand = "sh -c 'node src/setup-db.js > /tmp/setup-db.log 2>&1 & node src/web-server.js'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "safety-web"
